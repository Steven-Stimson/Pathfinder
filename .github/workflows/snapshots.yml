name: build-snapshots

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*"
    branches: [ dev, Pathfinder, 'BandagePro*' ]

env:
  BUILD_TYPE: Release
  QT_QPA_PLATFORM: offscreen
  XDG_RUNTIME_DIR: '/tmp/runtime-runner'
  QT_VERSION: 6.7.3

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    name: '🐧 Ubuntu 24.04'

    steps:
      - id: commit
        uses: pr-mpt/actions-commit-hash@v3

      - name: '🧰 Checkout'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: '⚙️ Grab cmake & ninja'
        uses: lukka/get-cmake@latest

      - name: '⚙️ Install Qt'
        uses: jurplel/install-qt-action@v3
        with:
          cache: true
          cache-key-prefix: ${{ runner.os }}-QtCache
          version: ${{env.QT_VERSION}}

      - name: '⚙️ Install dependencies'
        run: sudo apt-get install -y appstream libxcb-cursor0 glpk-utils

      - name: '⚙️ Build TTT standalone binary'
        run: |
          sudo apt-get install -y glpk-utils
          cd ${{github.workspace}}/Pathfinder/TTT
          pip3 install -r requirements.txt pyinstaller
          cp $(which glpsol) .
          PULP_DIR=$(python3 -c "import pulp, os; print(os.path.dirname(pulp.__file__))")
          pyinstaller --onefile --name ttt \
            --add-data "glpsol:." \
            --add-data "${PULP_DIR}/solverdir:pulp/solverdir" \
            --collect-data pulp \
            TTT.py
          cp dist/ttt ttt
          chmod +x ttt

      - name: '⚙️ Configure CMake'
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INSTALL_PREFIX=/usr -G Ninja

      - name: '🚧 Build'
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: '⚙️ Make AppDir'
        working-directory: ${{github.workspace}}/build
        run: |
          DESTDIR=AppDir cmake --install ${{github.workspace}}/build
          mkdir -p AppDir/usr/Pathfinder/TTT
          cp ../Pathfinder/TTT/ttt AppDir/usr/Pathfinder/TTT/
          cp ../Pathfinder/TTT/glpsol AppDir/usr/Pathfinder/TTT/

      - name: '⚙️ Install Linuxdeploy'
        working-directory: ${{github.workspace}}/build
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: '📦 Make AppImage'
        working-directory: ${{github.workspace}}/build
        run: |
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so;libqminimal.so"

          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv BandagePro++*.AppImage BandageProPP-Linux-${{steps.commit.outputs.short}}.AppImage
        shell: bash

      - name: '📤 Upload artifact: AppImage'
        uses: actions/upload-artifact@v4
        with:
          name: BandageProPP-Linux-${{steps.commit.outputs.short}}.AppImage
          path: ${{github.workspace}}/build/BandageProPP-Linux-*.AppImage

  build-mac:
    runs-on: macos-latest
    name: '🍎 macOS'
    steps:
      - id: commit
        uses: pr-mpt/actions-commit-hash@v3

      - name: '🧰 Checkout'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: '⚙️ Grab cmake & ninja'
        uses: lukka/get-cmake@latest

      - name: '⚙️ Install Qt'
        uses: jurplel/install-qt-action@v3
        with:
          cache: true
          cache-key-prefix: ${{ runner.os }}-QtCache
          version: ${{env.QT_VERSION}}

      - name: '⚙️ Build TTT standalone binary'
        run: |
          brew install glpk
          cd ${{github.workspace}}/Pathfinder/TTT
          pip3 install -r requirements.txt pyinstaller
          cp $(which glpsol) .
          PULP_DIR=$(python3 -c "import pulp, os; print(os.path.dirname(pulp.__file__))")
          pyinstaller --onefile --name ttt \
            --add-data "glpsol:." \
            --add-data "${PULP_DIR}/solverdir:pulp/solverdir" \
            --collect-data pulp \
            TTT.py
          cp dist/ttt ttt
          chmod +x ttt

      - name: '⚙️ Create stub AGL framework'
        # Xcode 26 / macOS 26 removed AGL.framework. Qt 6.7 still references it,
        # so we create an empty stub to satisfy the linker.
        run: |
          AGL_DIR="${{github.workspace}}/build/agl-stub/AGL.framework/Versions/A"
          mkdir -p "$AGL_DIR"
          # Create an empty C file and compile into a stub dylib
          echo "void agl_stub(void) {}" > /tmp/agl_stub.c
          cc -arch arm64 -dynamiclib -install_name @rpath/AGL.framework/AGL -o "$AGL_DIR/AGL" /tmp/agl_stub.c
          ln -sf Versions/A/AGL "${{github.workspace}}/build/agl-stub/AGL.framework/AGL"

      - name: '⚙️ Configure CMake'
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_FRAMEWORK_PATH="${{github.workspace}}/build/agl-stub" -G Ninja

      - name: '🚧 Build'
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: '📦 Make DMG'
        working-directory: ${{github.workspace}}/build
        run: |
          mkdir -p BandagePro++.app/Contents/Pathfinder/TTT
          cp ../Pathfinder/TTT/ttt BandagePro++.app/Contents/Pathfinder/TTT/
          cp ../Pathfinder/TTT/glpsol BandagePro++.app/Contents/Pathfinder/TTT/
          macdeployqt BandagePro++.app -dmg
          mv *.dmg BandageProPP-macOS-${{steps.commit.outputs.short}}.dmg

      - name: '📤 Upload artifact: DMG'
        uses: actions/upload-artifact@v4
        with:
          name: BandageProPP-macOS-${{steps.commit.outputs.short}}.dmg
          path: ${{github.workspace}}/build/BandageProPP-macOS-*.dmg

  build-windows:
    runs-on: windows-latest
    name: '🧊 Windows'
    steps:
      - id: commit
        uses: pr-mpt/actions-commit-hash@v3

      - name: '🧰 Checkout'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: '⚙️ Grab cmake & ninja'
        uses: lukka/get-cmake@latest

      - name: '⚙️ Configure MSVC'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: '⚙️ Install Qt'
        uses: jurplel/install-qt-action@v3
        with:
          cache: true
          cache-key-prefix: ${{ runner.os }}-QtCache
          version: ${{env.QT_VERSION}}

      - name: '⚙️ Install GLPK'
        shell: bash
        run: choco install glpk -y

      - name: '⚙️ Build TTT standalone binary'
        shell: bash
        working-directory: Pathfinder/TTT
        run: |
          pip install -r requirements.txt pyinstaller
          # Find glpsol.exe from chocolatey install
          cp "/c/ProgramData/chocolatey/lib/glpk/tools/winglpk-5.00/w64/glpsol.exe" . 2>/dev/null || \
          cp "/c/ProgramData/chocolatey/bin/glpsol.exe" . 2>/dev/null || \
          which glpsol && cp "$(which glpsol)" . || \
          (echo "ERROR: glpsol.exe not found" && exit 1)
          # Find pulp solver directory and bundle it
          PULP_DIR=$(python -c "import pulp, os; print(os.path.dirname(pulp.__file__))")
          pyinstaller --onefile --name ttt \
            --add-data "glpsol.exe;." \
            --add-data "${PULP_DIR}/solverdir;pulp/solverdir" \
            --collect-data pulp \
            TTT.py
          cp dist/ttt.exe ttt.exe

      - name: '⚙️ Configure CMake'
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INSTALL_PREFIX=/usr -G Ninja

      - name: '🚧 Build'
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: '📦 Make package'
        working-directory: ${{github.workspace}}/build
        run: |
          mkdir -p BandageProPP/Pathfinder/TTT
          cp BandagePro++.exe BandageProPP/
          cp ../Pathfinder/TTT/ttt.exe BandageProPP/Pathfinder/TTT/
          cp ../Pathfinder/TTT/glpsol.exe BandageProPP/Pathfinder/TTT/
          windeployqt BandageProPP --release --compiler-runtime
          cd BandageProPP && 7z a ../BandageProPP-win-${{steps.commit.outputs.short}}.zip .

      - name: '📤 Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: BandageProPP-win-${{steps.commit.outputs.short}}
          path: ${{github.workspace}}/build/BandageProPP-win-*.zip

  # Upload continuous build
  upload:
      name: '🗂 Create release and upload artifacts'
      needs:
        - build-linux
        - build-mac
        - build-windows
      runs-on: ubuntu-24.04
      permissions:
        contents: write # For release uploads
      steps:
      - name: '⚙️ Install dependencies'
        run: sudo apt-get install -y libfuse2
      - name: '📥 Download artifacts'
        uses: actions/download-artifact@v4
      - name: '🗂 Inspect directory after downloading artifacts'
        run: ls -alFR
      - name: '🚀 Create release and upload artifacts'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            wget -q https://github.com/TheAssassin/pyuploadtool/releases/download/continuous/pyuploadtool-x86_64.AppImage
            chmod +x pyuploadtool-x86_64.AppImage
            ./pyuploadtool-x86_64.AppImage **/BandageProPP-Linux-*.AppImage
            ./pyuploadtool-x86_64.AppImage **/BandageProPP-macOS-*.dmg
            ./pyuploadtool-x86_64.AppImage **/BandageProPP-win-*.zip
